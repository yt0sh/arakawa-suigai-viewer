name: External links

on:
  workflow_dispatch:
  schedule:
    - cron: '17 12 1 * *'
      timezone: 'Asia/Tokyo'
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'api/**'
      - 'lib/**'
      - 'config/external-links.json'
      - 'scripts/check-external-links.mjs'
      - '.github/workflows/external-links.yml'
  pull_request:
    branches: [main]
    paths:
      - 'public/**'
      - 'api/**'
      - 'lib/**'
      - 'config/external-links.json'
      - 'scripts/check-external-links.mjs'
      - '.github/workflows/external-links.yml'

permissions:
  contents: read

concurrency:
  group: external-links-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check external links
        run: npm run check:links
