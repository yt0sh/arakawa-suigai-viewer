name: Release

on:
  push:
    branches: [main]
    paths:
      - package.json
      - README.md
      - docs/releases/**
      - .github/workflows/release.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read and validate version
        id: version
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v${VERSION}"
          grep -Fq "**${TAG}**" README.md
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Sync release notes and create current release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          shopt -s nullglob
          for NOTES_FILE in docs/releases/v*.md; do
            RELEASE_TAG="$(basename "$NOTES_FILE" .md)"
            if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
              gh release edit "$RELEASE_TAG" --notes-file "$NOTES_FILE"
              echo "Updated release notes for $RELEASE_TAG."
            fi
          done

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists; release notes are synchronized."
            exit 0
          fi

          NOTES_FILE="docs/releases/${TAG}.md"
          TITLE="${TAG} — 日暮里・荒川 水害情報ビューア"
          if [[ -f "$NOTES_FILE" ]]; then
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "$TITLE" \
              --notes-file "$NOTES_FILE"
          else
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "$TITLE" \
              --generate-notes
          fi
